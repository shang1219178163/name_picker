<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1228">
  <meta name="color-scheme" content="dark">
  <title>点名器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322d3ee'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='%23080c17'/><rect x='3' y='3' width='94' height='94' rx='24' fill='none' stroke='url(%23g)' stroke-width='3'/><text x='50' y='70' font-family='PingFang SC, Microsoft YaHei, sans-serif' font-size='50' font-weight='700' text-anchor='middle' fill='%23f5cf5e'>点</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas class="twinkles" id="twinkles" aria-hidden="true"></canvas>
  <div class="meteors" aria-hidden="true"><span></span></div>
  <div class="app">
    <header class="topbar">
      <span class="roster-stat" id="rosterStat">名单 0 人</span>
      <h1 class="title">点名器</h1>
      <div class="top-actions">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
        <button class="import-btn" id="importBtn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          导入 Excel
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="动态设置" aria-expanded="false" aria-controls="settingsMenu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

        <div class="settings-menu" id="settingsMenu" hidden>
          <div class="settings-head">
            <strong>动态参数</strong>
            <button class="settings-close" id="settingsClose" type="button" aria-label="关闭设置">×</button>
          </div>

          <label class="setting">
            <span>流星间隔</span>
            <output id="valMeteorCycle">5.0s</output>
            <input type="range" id="optMeteorCycle" min="3" max="12" step="0.5" value="5">
          </label>

          <label class="setting">
            <span>流星头部大小</span>
            <output id="valMeteorHead">9px</output>
            <input type="range" id="optMeteorHead" min="4" max="20" step="1" value="9">
          </label>

          <label class="setting">
            <span>背景星数量</span>
            <output id="valBaseStarCount">1200 颗</output>
            <input type="range" id="optBaseStarCount" min="0" max="2000" step="100" value="1200">
          </label>

          <label class="setting">
            <span>闪烁星数量</span>
            <output id="valStarCount">100 颗</output>
            <input type="range" id="optStarCount" min="100" max="1000" step="100" value="100">
          </label>

          <label class="setting">
            <span>星点呼吸速度</span>
            <output id="valTwinkleSpeed">1.00×</output>
            <input type="range" id="optTwinkleSpeed" min="0.5" max="2.5" step="0.05" value="1">
          </label>

          <label class="setting">
            <span>极光流动速度</span>
            <output id="valAuroraSpeed">1.00×</output>
            <input type="range" id="optAuroraSpeed" min="0.5" max="2" step="0.05" value="1">
          </label>

          <button class="settings-reset" id="settingsReset" type="button">恢复默认</button>
        </div>
      </div>
    </header>

    <main class="panel" id="panel">
      <div class="name" id="nameDisplay" aria-live="polite">准备开始</div>
    </main>

    <section class="controls" aria-label="点名操作">
      <button class="ctrl start" id="toggleBtn" type="button" aria-pressed="false">开始随机</button>
      <button class="ctrl reset" id="resetAllBtn" type="button">重置名单</button>
      <button class="ctrl clear" id="clearPickedBtn" type="button">清空记录</button>
    </section>

    <section class="history">
      <h2 class="history-title">已提问过的同学：</h2>
      <div class="history-list" id="historyList"></div>
      <p class="history-empty" id="historyEmpty">暂无记录</p>
    </section>
  </div>

  <div class="drop-mask" id="dropMask">
    <div class="drop-box">
      <strong>松开即可导入</strong>
      <span>支持 .xlsx / .xls / .csv</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
