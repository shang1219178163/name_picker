<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="color-scheme" content="dark">
  <title>点名器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236d5efc'/><stop offset='0.55' stop-color='%234f80ee'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><rect x='4.5' y='4.5' width='91' height='91' rx='23' fill='none' stroke='%23ffffff' stroke-opacity='0.4' stroke-width='2'/><path d='M24 30c12-8 28-8 40 0' stroke='%23ffffff' stroke-opacity='0.45' stroke-width='4' stroke-linecap='round' fill='none'/><text x='50' y='70' font-family='PingFang SC, Microsoft YaHei, sans-serif' font-size='52' font-weight='700' text-anchor='middle' fill='%23ffffff'>点</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="app">
    <header class="topbar">
      <span class="roster-stat" id="rosterStat">名单 0 人</span>
      <h1 class="title">点名器</h1>
      <div class="top-actions">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
        <button class="import-btn" id="importBtn" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          导入 Excel
        </button>
      </div>
    </header>

    <main class="panel" id="panel">
      <div class="name" id="nameDisplay" aria-live="polite">准备开始</div>
    </main>

    <section class="controls" aria-label="点名操作">
      <button class="ctrl start" id="toggleBtn" type="button" aria-pressed="false">开始随机</button>
      <button class="ctrl reset" id="resetAllBtn" type="button">重置名单</button>
      <button class="ctrl clear" id="clearPickedBtn" type="button">清空记录</button>
    </section>

    <section class="history">
      <h2 class="history-title">已提问过的同学：</h2>
      <div class="history-list" id="historyList"></div>
      <p class="history-empty" id="historyEmpty">暂无记录</p>
    </section>
  </div>

  <div class="drop-mask" id="dropMask">
    <div class="drop-box">
      <strong>松开即可导入</strong>
      <span>支持 .xlsx / .xls / .csv</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
